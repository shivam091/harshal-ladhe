<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Per-Keyframe steps() Playground</title>
  </head>
  <body>
    <main class="playground">
      <header class="playground-header">
        <h1>Hybrid Motion: Smooth, Then Stepped</h1>
        <p>
          <code>animation-timing-function</code> set <em>inside</em> a keyframe only governs the
          segment leading into it — the first half here eases, the second half ticks.
        </p>
      </header>

      <section class="demo-area" aria-label="Hybrid vs. all-smooth comparison">
        <div class="track-row">
          <span class="track-label">Hybrid</span>
          <div class="track">
            <div class="midpoint-marker"></div>
            <div id="hybrid-box" class="mover mover-accent"></div>
          </div>
        </div>

        <div class="track-row">
          <span class="track-label">All ease</span>
          <div class="track">
            <div class="midpoint-marker"></div>
            <div id="smooth-box" class="mover"></div>
          </div>
        </div>

        <p class="legend">
          <span class="dot dot-ease"></span> 0%–50% ease &nbsp;
          <span class="dot dot-steps"></span> 50%–100% steps()
        </p>
      </section>

      <fieldset class="control-group">
        <legend>Second-Half Controls</legend>
        <div class="fields-grid">
          <div class="field">
            <label for="steps-count">Steps (50%–100%)</label>
            <input type="number" id="steps-count" min="1" max="10" step="1" value="4">
          </div>

          <div class="field">
            <label for="duration-input">Duration</label>
            <div class="field-input">
              <input type="number" id="duration-input" min="1" max="6" step="0.5" value="2.5">
              <select id="duration-unit" class="unit-select" aria-label="Duration unit">
                <option value="s">s</option>
                <option value="ms">ms</option>
              </select>
            </div>
          </div>
        </div>
      </fieldset>

      <button id="replay-btn" class="toggle-btn">Replay</button>
    </main>

    <script src="./index.js"></script>
  </body>
</html>

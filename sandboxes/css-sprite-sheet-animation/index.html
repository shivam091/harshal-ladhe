<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprite Sheet Animation Playground</title>
  </head>
  <body>
    <main class="playground">
      <header class="playground-header">
        <h1>Sprite Sheet Walk Cycle</h1>
        <p>A generated sprite sheet, stepped with <code>steps()</code> against <code>background-position</code>. No image file needed — the frames are drawn on a canvas at runtime.</p>
      </header>

      <section class="demo-area" aria-label="Sprite preview">
        <div class="stage">
          <div id="sprite" class="sprite"></div>
        </div>
        <canvas id="sheet-canvas" class="sheet-preview" aria-label="Generated sprite sheet"></canvas>
        <p class="readout">Frame <span id="frame-readout">1</span> / <span id="frame-total">6</span></p>
      </section>

      <fieldset class="control-group">
        <legend>Sprite Controls</legend>
        <div class="fields-grid">
          <div class="field">
            <label for="frame-count">Frame count</label>
            <input type="number" id="frame-count" min="3" max="10" step="1" value="6">
          </div>

          <div class="field">
            <label for="jump-term">Jump Term</label>
            <select id="jump-term">
              <option value="end" selected>end (default)</option>
              <option value="start">start</option>
            </select>
          </div>

          <div class="field">
            <label for="duration-input">Cycle time</label>
            <div class="field-input">
              <input type="number" id="duration-input" min="0.3" max="3" step="0.1" value="0.9">
              <select id="duration-unit" class="unit-select" aria-label="Cycle time unit">
                <option value="s">s</option>
                <option value="ms">ms</option>
              </select>
            </div>
          </div>
        </div>
      </fieldset>

      <button id="play-btn" class="toggle-btn">Pause</button>
    </main>

    <script src="./index.js"></script>
  </body>
</html>

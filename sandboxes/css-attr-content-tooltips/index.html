<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>attr() Tooltips Playground</title>
  </head>
  <body>
    <main class="playground">
      <header class="playground-header">
        <h1>CSS-Only Tooltips with attr()</h1>
        <p>Hover over a button, or Tab to it. Its tooltip text comes straight from an HTML attribute via <code>content: attr(...)</code>, with no JavaScript.</p>
      </header>

      <section class="demo-area" aria-label="Tooltip preview">
        <div class="toolbar" id="toolbar" data-tooltip-position="top" data-tooltip-source="data-tooltip">
          <button class="icon-btn" type="button" aria-label="Save changes" data-tooltip="Save changes (Ctrl+S)">💾</button>
          <button class="icon-btn" type="button" aria-label="Duplicate" data-tooltip="Duplicate this item (Ctrl+D)">📄</button>
          <button class="icon-btn" type="button" aria-label="Move to bin" data-tooltip="Move to bin (Del)">🗑️</button>
          <button class="icon-btn" type="button" aria-label="Share" data-tooltip="Share with your team">🔗</button>
        </div>
      </section>

      <fieldset class="control-group">
        <legend>Tooltip text</legend>
        <div class="segmented-control" role="radiogroup" aria-label="Tooltip text">
          <label class="segment"><input type="radio" name="source" value="data-tooltip" checked><span>data-tooltip</span></label>
          <label class="segment"><input type="radio" name="source" value="aria-label"><span>aria-label</span></label>
        </div>
      </fieldset>

      <fieldset class="control-group">
        <legend>Tooltip position</legend>
        <div class="segmented-control" role="radiogroup" aria-label="Tooltip position">
          <label class="segment"><input type="radio" name="position" value="top" checked><span>Top</span></label>
          <label class="segment"><input type="radio" name="position" value="bottom"><span>Bottom</span></label>
        </div>

        <label class="checkbox-field">
          <input type="checkbox" id="clip-toggle">
          Clip with <code>overflow: hidden</code> on the toolbar
        </label>
      </fieldset>

      <output id="readout" class="readout" aria-live="polite"></output>
    </main>

    <script src="./index.js"></script>
  </body>
</html>

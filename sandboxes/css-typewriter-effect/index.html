<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Typewriter Effect Playground</title>
  </head>
  <body>
    <main class="playground">
      <header class="playground-header">
        <h1>CSS Typewriter Effect</h1>
        <p>A <code>width</code> reveal ticked out by <code>steps(n, end)</code> — one step per character — paired with a <code>step-end</code> blinking cursor.</p>
      </header>

      <section class="demo-area" aria-label="Typewriter preview">
        <p id="typewriter" class="typewriter"></p>
      </section>

      <fieldset class="control-group">
        <legend>Typing Controls</legend>
        <div class="fields-grid">
          <div class="field">
            <label for="phrase-select">Phrase</label>
            <select id="phrase-select">
              <option value="This is steps() in action." selected>This is steps() in action.</option>
              <option value="Hello, world!">Hello, world!</option>
              <option value="The quick brown fox jumps.">The quick brown fox jumps.</option>
              <option value="Loading, please wait...">Loading, please wait...</option>
            </select>
          </div>

          <div class="field">
            <label for="duration-input">Duration</label>
            <div class="field-input">
              <input type="number" id="duration-input" min="0.5" max="8" step="0.5" value="3">
              <select id="duration-unit" class="unit-select" aria-label="Duration unit">
                <option value="s">s</option>
                <option value="ms">ms</option>
              </select>
            </div>
          </div>

          <div class="field field--full">
            <label class="checkbox-field" for="cursor-toggle">
              <input type="checkbox" id="cursor-toggle" checked>
              <span>Blinking cursor (<code>step-end</code>)</span>
            </label>
          </div>
        </div>
      </fieldset>

      <p class="readout">Steps: <span id="steps-readout">0</span> — one per character in the phrase</p>

      <button id="replay-btn" class="toggle-btn">Replay</button>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
